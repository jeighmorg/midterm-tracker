name: Update Election Data

on:
  schedule:
    # Every Monday at 12:00 UTC.
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest data
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: node scripts/fetch-all.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/
          git diff --cached --quiet && exit 0
          git commit -m "Update election data ($(date -u +%Y-%m-%d))"
          # This step alone takes 15-30+ min (mostly the FEC fetch), long enough
          # that other pushes to master routinely land first - rebase onto
          # whatever's there now instead of a bare `git push` that fails outright
          # on any non-fast-forward (hit this once; see git history).
          git pull --rebase origin master
          git push
