name: Update Election Data

on:
  schedule:
    # Every Monday at 12:00 UTC.
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Each fetcher only overwrites its own file on success, so a failure in one
      # source leaves the old copy in place. Don't let that block committing the
      # sources that DID update (a single renamed Wikipedia section silently
      # froze the whole site for 7 weeks) - commit first, then fail the job below.
      - name: Fetch latest data
        id: fetch
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: node scripts/fetch-all.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/
          git diff --cached --quiet && exit 0
          git commit -m "Update election data ($(date -u +%Y-%m-%d))"
          # This step alone takes 15-30+ min (mostly the FEC fetch), long enough
          # that other pushes to master routinely land first - rebase onto
          # whatever's there now instead of a bare `git push` that fails outright
          # on any non-fast-forward (hit this once; see git history).
          git pull --rebase origin master
          git push

      - name: Fail the run if any data source failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "One or more data sources failed to update - see the 'Fetch latest data' step. Sources that succeeded were still committed."
          exit 1
